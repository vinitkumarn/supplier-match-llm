[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "suppmatch"
version = "0.1.0"
description = "Suggests SAP -> Oracle Fusion supplier matches (MATCH / NEW / NEEDS_HUMAN) for review. Never merges."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pydantic>=2.7",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
# The real embedding model. Not needed for tests (they use a FakeEmbedder).
embed = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
